name: Pruebas y Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probar-y-publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar pruebas con cobertura
        run: npm run coverage

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Comprobar Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          call: check

      - name: Comprobar Docker Bake
        uses: docker/bake-action@v6
        with:
          targets: validate-build

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Crear y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/actividad-docker-gastos:latest